<!-- O Formulário -->
<form id="meuFormulario">
    <label for="nome">Nome:</label>
    <input type="text" id="nome" name="name" required>

    <label for="email">E-mail:</label>
    <input type="email" id="email" name="email" required>

    <label for="mensagem">Mensagem:</label>
    <textarea id="mensagem" name="message" required></textarea>

    <button type="submit" id="botaoEnviar">Enviar Mensagem</button>
</form>

<!-- Espaço onde a mensagem de sucesso ou erro vai aparecer -->
<div id="statusMensagem" style="margin-top: 15px; font-weight: bold;"></div>

<!-- Código JavaScript para processar o envio na mesma tela -->
<script>
document.getElementById('meuFormulario').addEventListener('submit', function(e) {
    e.preventDefault(); // Impede a página de recarregar

    const form = e.target;
    const botao = document.getElementById('botaoEnviar');
    const status = document.getElementById('statusMensagem');

    // Avisa o usuário que está enviando e desativa o botão
    botao.disabled = true;
    status.style.color = "blue";
    status.innerText = "Enviando...";

    // Captura os dados do formulário
    const formData = new FormData(form);

    // Envia os dados para o FormSubmit em segundo plano (mude para o seu e-mail)
    fetch("habitos.fatec@gmail.com", {
        method: "POST",
        body: formData,
        headers: {
            'Accept': 'application/json'
        }
    })
    .then(response => {
        if (response.ok) {
            status.style.color = "green";
            status.innerText = "Mensagem enviada com sucesso!";
            form.reset(); // Limpa os campos do formulário
        } else {
            status.style.color = "red";
            status.innerText = "Ops! Ocorreu um erro ao enviar.";
        }
    })
    .catch(error => {
        status.style.color = "red";
        status.innerText = "Erro de conexão com o servidor.";
    })
    .finally(() => {
        botao.disabled = false; // Reativa o botão
    });
});
</script>
