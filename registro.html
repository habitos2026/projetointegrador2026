<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title class="lang-text" data-pt="Registro" data-en="Register">Registro</title>
    <link rel="stylesheet" href="estilos.css">
    <style>
        :root {
            --cor-mente: #6a89cc;    /* Azul sereno */
            --cor-fisico: #38ada9;   /* Verde energia */
            --cor-agua: #4a69bd;     /* Azul hidratação */
            --cor-fundo: #f7f9fc;
            --cor-primaria: #0f766e; /* Cor padrão para títulos e botões */
        }

        /* Animação de Entrada */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        body {
            font-family: 'Segoe UI', Roboto, sans-serif;
            line-height: 1.6;
            background-color: var(--cor-fundo);
            color: #2f3542;
            max-width: 800px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        header {
            text-align: center;
            margin-bottom: 50px;
            animation: fadeInUp 0.8s ease-out;
        }

        h1 {
            color: var(--cor-mente);
            font-size: 2.5rem;
            border-bottom: 3px solid var(--cor-fisico);
            display: inline-block;
            padding-bottom: 10px;
        }

        section {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            animation: fadeInUp 1s ease-out;
        }

        h2 {
            color: var(--cor-fisico);
            margin-top: 30px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* ÁREA DO REGISTRO */
        .registro-page {
            background: linear-gradient(135deg, #f5f7fb, #f5f7fb);
            min-height: 100vh;
            padding: 40px 10px;
        }

        /* CARD */
        .registro-box {
            max-width: 500px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
            animation: subir 0.6s ease;
        }

        /* ANIMAÇÃO */
        @keyframes subir {
            from {
                opacity: 0;
                transform: translateY(40px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .registro-box h1 {
            text-align: center;
            color: var(--cor-primaria);
            margin-bottom: 20px;
            border-bottom: none;
            padding-bottom: 0;
        }

        /* FORM */
        .registro-form {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        /* CORRIGIDO: CSS dos Inputs e Textareas ajustados corretamente */
        .registro-form input,
        .registro-form textarea {
            width: 100%;
            box-sizing: border-box;
            padding: 12px;
            border-radius: 10px;
            border: 1px solid #cbd5e1;
            outline: none;
            transition: 0.3s;
            font-size: 1rem;
        }

        .registro-form input:focus,
        .registro-form textarea:focus {
            border-color: var(--cor-primaria);
            box-shadow: 0 0 8px rgba(15,118,110,0.3);
        }

        /* Validações Visuais de Validação */
        .registro-form input:focus:invalid,
        .registro-form textarea:focus:invalid {
            border: 1px solid #e11d48;
            box-shadow: 0 0 8px rgba(225, 29, 72, 0.4);
        }

        .registro-form input:focus:valid,
        .registro-form textarea:focus:valid {
            border: 1px solid var(--cor-fisico);
            box-shadow: 0 0 8px rgba(56, 173, 169, 0.4);
        }

        /* BOTÕES */
        .registro-form button,
        .registro-box button {
            padding: 12px;
            border: none;
            border-radius: 10px;
            background: var(--cor-primaria);
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            font-size: 1rem;
        }

        .registro-form button:hover,
        .registro-box button:hover {
            background: #115e59;
            transform: scale(1.02);
            box-shadow: 0 4px 12px rgba(15, 118, 110, 0.3);
        }

        /* LINKS AUXILIARES */
        .auth-link {
            display: flex;
            justify-content: space-between;
            font-size: 0.9rem;
            margin: 5px 0;
        }

        .auth-link a {
            color: var(--cor-primaria);
            text-decoration: none;
            font-weight: 600;
        }

        .auth-link a:hover {
            text-decoration: underline;
        }

        /* MENSAGENS DE ERRO */
        .erro {
            color: #e11d48;
            font-size: 0.8rem;
            margin: 4px 0 0 4px;
            display: none; /* Deixe oculto por padrão até validação ativa */
        }

        /* TEXTO DE INFO */
        .info {
            text-align: center;
            margin-top: 20px;
            color: #64748b;
            font-size: 0.9rem;
        }

        textarea {
            resize: none;
        }

        /* BOTÃO DE IDIOMA FIXO NO TOPO */
        #btn-lang {
            position: absolute;
            top: 20px;
            right: 20px;
            background: white;
            border: 1px solid #cbd5e1;
            padding: 8px 16px;
            border-radius: 20px;
            color: #2f3542;
        }
    </style>
</head>
<body>

    <button onclick="mudarIdioma()" id="btn-lang" data-pt="English" data-en="Português">English</button>
    
    <div class="registro-page">
        <div class="registro-box">
            <h1 class="lang-text" data-pt="Criar Conta 📝" data-en="Create Account 📝">Criar Conta 📝</h1>

            <form class="registro-form" method="post">
                <div class="registrogrupoContato">
                    <input type="text" maxlength="70" placeholder="Seu nome" required data-pt="Seu nome" data-en="Your name">
                    <p class="erro lang-text" data-pt="Este campo é obrigatório. Por favor, informe seu nome" data-en="This field is required. Please enter your name">Este campo é obrigatório. Por favor, informe seu nome</p>
                </div>

                <div class="registrogrupoContato">
                    <input type="email" maxlength="100" placeholder="Seu email" required data-pt="Seu email" data-en="Your email">
                    <p class="erro lang-text" data-pt="Informe seu e-mail" data-en="Enter your email">Informe seu e-mail</p>
                </div>

                <div class="registrogrupoContato">
                    <input type="password" maxlength="50" placeholder="Sua senha" required data-pt="Sua senha" data-en="Your password">
                    <p class="erro lang-text" data-pt="Informe a sua senha" data-en="Enter your password">Informe a sua senha</p>
                </div>

                <div class="auth-link">
                    <span class="lang-text" data-pt="Já tem uma conta?" data-en="Already have an account?">Já tem uma conta?</span>
                    <a href="contato.html" class="lang-text" data-pt="Fale Conosco" data-en="Contact Us">Fale Conosco</a>
                </div>
                
                <button type="submit" class="lang-text" data-pt="Registrar" data-en="Register">Registrar</button>
            </form>
            
            <div class="info lang-text" data-pt="Preencha os campos para se cadastrar 🚀" data-en="Fill in the fields to sign up 🚀">
                Preencha os campos para se cadastrar 🚀
            </div>
        </div>
    </div>

    <script>
        let idiomaAtual = 'pt';
        function mudarIdioma() {
            const elementos = document.querySelectorAll('[data-pt]');
            const botao = document.getElementById('btn-lang');
            
            if (idiomaAtual === 'pt') {
                elementos.forEach(el => {
                    if (el.tagName === 'INPUT') {
                        el.placeholder = el.getAttribute('data-en');
                    } else {
                        el.innerText = el.getAttribute('data-en');
                    }
                });
                document.documentElement.lang = 'en';
                botao.innerText = 'Português';
                idiomaAtual = 'en';
            } else {
                elementos.forEach(el => {
                    if (el.tagName === 'INPUT') {
                        el.placeholder = el.getAttribute('data-pt');
                    } else {
                        el.innerText = el.getAttribute('data-pt');
                    }
                });
                document.documentElement.lang = 'pt-BR';
                botao.innerText = 'English';
                idiomaAtual = 'pt';
            }
        }
    </script>
</body>
</html>
                                                                                                                                                                                                                                </html>
