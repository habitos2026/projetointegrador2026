<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Checklist</title>

<link rel="stylesheet" href="estilos.css">

<style>
/* SÓ O CHECKLIST (não mexe no resto do site) */

.check-container {
    max-width: 500px;
    margin: 40px auto;
    background: white;
    padding: 25px;
    border-radius: 15px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.1);
}

/* TÍTULO */
.check-container h1 {
    text-align: center;
    color: #0f766e;
}

/* DATA */
.check-container input[type="date"] {
    display: block;
    margin: 10px auto 20px;
    padding: 8px;
}

/* PROGRESSO */
.progresso {
    text-align: center;
    margin-bottom: 10px;
    font-weight: bold;
    color: #0f766e;
}

/* BARRA */
.barra {
    width: 100%;
    height: 10px;
    background: #e5e7eb;
    border-radius: 10px;
    overflow: hidden;
    margin-bottom: 20px;
}

.barra span {
    display: block;
    height: 100%;
    width: 0%;
    background: #0f766e;
    transition: 0.3s;
}

/* ITENS */
.habit-item {
    display: flex;
    align-items: center;
    gap: 10px;
    background: #f9fafb;
    padding: 12px;
    border-radius: 10px;
    margin-bottom: 10px;
}

.habit-item input {
    width: 18px;
    height: 18px;
}

/* TEXTO */
.habit-item span {
    font-weight: 500;
}

/* MARCADO */
.habit-item input:checked + span {
    text-decoration: line-through;
    color: #9ca3af;
}

/* MENSAGEM */
.msg {
    text-align: center;
    margin-top: 10px;
    color: green;
    font-weight: bold;
}
</style>

</head>

<body>

<div id="menu"></div>

<section class="intro">

    <h1>Checklist de Hábitos Saudáveis</h1>

    <p>
        Use a lista abaixo para acompanhar seus hábitos.
    </p>

</section>

        Calcular
    </button>

    <p id="resultadoAgua"></p>

</div>

<!-- DATA -->
<input type="date">

<!-- PROGRESSO -->
<div class="progresso">
    Meta: <span id="pct">0%</span>
</div>

<div class="barra">
    <span id="bar"></span>
</div>

<!-- CHECKLIST -->

    <header>

    <button class="botaoMenu">

        <div></div>
        <div></div>
        <div></div>

    </button>

    <nav>

        <div class="topoMenu">

        </div>

        <a href="index.html">Início</a>

        <a href="sono.html">Sono</a>
        <a href="checklist.html">Checklist</a>
        <a href="contato.html">Contato</a>

    </nav>

</header>

</label>

</html>
