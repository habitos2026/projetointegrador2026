<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Qualidade de sono</title>

<link rel="stylesheet" href="estilos.css">

  <head>
<body>
<menu>
<div id="menu"></div>
<main>

<h1>A importancia da qualidade do sono</h1>

<p>Uma boa qualidade de sono é tão importante quanto os outros tópicos.</p>
<p>Segundo a OMS, 7/8 horas é o tempo ideal para uma pessoa adulta.</p>
<p>Para isso, além do horário, é preciso ter uma rotina coerente de sono.</p>

</p>
</menu>
</main>


<script>
fetch("menu.html")
.then(res => res.text())
.then(data => {

    document.getElementById("menu").innerHTML = data;

    // MENU MOBILE
    const botaoMenu = document.querySelector(".botaoMenu");
    const menuNav = document.getElementById("menuNav");
    const botaoFechar = document.getElementById("botaoFecharMenu");

    if(botaoMenu){
        botaoMenu.addEventListener("click", () => {
            menuNav.style.right = "0";
        });
    }

    if(botaoFechar){
        botaoFechar.addEventListener("click", () => {
            menuNav.style.right = "-100%";
        });
    }

});
</script>

  
</head>
</body>
