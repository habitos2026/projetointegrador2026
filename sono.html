<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-pt="Qualidade de Sono" data-en="Sleep Quality">Qualidade de Sono</title>
    <link rel="stylesheet" href="estilos.css">
<style>
          :root {
            --cor-mente: #6a89cc;    /* Azul sereno */
            --cor-fisico: #38ada9;   /* Verde energia */
            --cor-agua: #4a69bd;     /* Azul hidratação */
            --cor-fundo: #f7f9fc;
        }

        /* Animação de Entrada */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        body {
            font-family: 'Segoe UI', Roboto, sans-serif;
            line-height: 1.6;
            background-color: var(--cor-fundo);
            color: #2f3542;
            max-width: 800px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        header {
            text-align: center;
            margin-bottom: 50px;
            animation: fadeInUp 0.8s ease-out;
        }

        h1 {
            color: var(--cor-mente);
            font-size: 2.5rem;
            border-bottom: 3px solid var(--cor-fisico);
            display: inline-block;
            padding-bottom: 10px;
        }

        section {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            animation: fadeInUp 1s ease-out;
        }

        h2 {
            color: var(--cor-fisico);
            margin-top: 30px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
</style>


</head>
<body>
    <menu>
        <div id="menu"></div>
        <button onclick="mudarIdioma()" id="btn-lang">English</button>
    </menu>

    <main>
            <h1 data-pt="A importância da qualidade do sono" data-en="The importance of sleep quality">A importância da qualidade do sono</h1>
            <p data-pt="Uma boa qualidade de sono é tão importante quanto os outros tópicos." data-en="Good sleep quality is as important as the other topics.">Uma boa qualidade de sono é tão importante quanto os outros tópicos.</p>
            <p data-pt="Segundo a OMS, 7/8 horas é o tempo ideal para uma pessoa adulta." data-en="According to WHO, 7/8 hours is the ideal time for an adult.">Segundo a OMS, 7/8 horas é o tempo ideal para uma pessoa adulta.</p>
            <p data-pt="Para isso, além do horário, é preciso ter uma rotina coerente de sono." data-en="For this, besides the schedule, you need a coherent sleep routine.">Para isso, além do horário, é preciso ter uma rotina coerente de sono.</p>
            <p><strong data-pt='"Durma bem e tenha maior produtividade."' data-en='"Sleep well and have greater productivity."'>"Durma bem e tenha maior produtividade."</strong></p>

</p>
</menu>
</main>
  
<li>

  
</li>

<div class="bannerIndex">
    <img src="pasta-de-imagens/qualidade_sono_banner.webp" alt="Banner2" class="imgresp">
</div>

    <script>
        let idiomaAtual = 'pt';
        function mudarIdioma() {
            const elementos = document.querySelectorAll('[data-pt]');
            const botao = document.getElementById('btn-lang');
            if (idiomaAtual === 'pt') {
                elementos.forEach(el => {
                    el.innerText = el.getAttribute('data-en');
                });
                document.documentElement.lang = 'en';
                botao.innerText = 'Português';
                idiomaAtual = 'en';
            } else {
                elementos.forEach(el => {
                    el.innerText = el.getAttribute('data-pt');
                });
                document.documentElement.lang = 'pt-br';
                botao.innerText = 'English';
                idiomaAtual = 'pt';
            }
        }
    </script>
    <script src="trabalho.js"></script>
</body>
</html>
